image:
  repository: docker.io/jubatouam/order
  tag: "2.0"
  pullPolicy: Always

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: "25%"
    maxUnavailable: 0

affinity:
  nodepool: apps

service:
  type: ClusterIP
  port: 8000

probes:
  path: /api/health
  scheme: HTTP
  startup:
    initialDelaySeconds: 10
    timeoutSeconds: 3
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 60
  liveness:
    timeoutSeconds: 3
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  readiness:
    timeoutSeconds: 3
    periodSeconds: 5
    successThreshold: 1
    failureThreshold: 3

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 50m
    memory: 384Mi

# initContainer migrate: applies Django DB migrations against postgres-primary before pod starts
initContainer:
  enabled: true
  name: migrate
  command:
    - python
    - manage.py
    - migrate
    - --no-input
  env: []

configmap:
  DJANGO_SETTINGS_MODULE: "config.settings.prod"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOW_ALL_ORIGINS: "TRUE"
  LOG_LEVEL: "INFO"
  ENV_NAME: "prod"

secret:
  enabled: false
  data: {}

ingress:
  enabled: true
  name: ecommerce-ingress
  className: kong
  annotations: {}
  routes:
    - path: /api/orders
      pathType: Prefix
      service:
        name: order
        port: 8000

externalSecret:
  enabled: false
  refreshInterval: "1m"
  vaultPath: ""

netpolicies:
  ingresssources: kong
  ingressdestports: 8000
  ingressprotocol: TCP
  egresssources: pgcat
  egressdestports: 5432
  egressprotocol: TCP
  dnsport: 53
  httpsinternetports: 443
  httpsprotocol: TCP
